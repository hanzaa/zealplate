# 1. Pengaturan Backend & Keamanan
backend:
  name: git-gateway
  branch: main # Pastikan ini sesuai dengan branch utama di GitHub kamu

# 2. Fitur Editorial Workflow (PENTING untuk Review Konten)
# Ini memungkinkan status "Draft", "In Review", dan "Ready" di CMS
publish_mode: editorial_workflow

# 3. Pengaturan Media
# Saya sarankan struktur folder yang rapi agar tidak tercampur
media_folder: "static/images/berita"
public_folder: "/images/berita"

# 4. Definisi Koleksi Konten
collections:
  - name: "berita"
    label: "Berita & Laporan Kegiatan"
    folder: "content/english/blog"
    create: true
    # Menggunakan slug yang SEO-friendly
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Judul Kegiatan", name: "title", widget: "string"}
      - {label: "Tanggal Pelaksanaan", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss"}
      - {label: "Penulis / Pelapor", name: "author", widget: "string", default: "Admin Zeal"}
      
      # Kategori: Menggunakan widget select yang lebih fleksibel
      - label: "Kategori Kegiatan"
        name: "categories"
        widget: "select"
        multiple: true
        options: ["Laporan Operasional", "Pengumuman", "Siaran Pers", "Keamanan Siber", "Umum"]
        default: ["Umum"]

      # Klasifikasi Keamanan: Sangat krusial untuk standar pemerintahan
      - label: "Klasifikasi Keamanan"
        name: "tags"
        widget: "select"
        multiple: false # Biasanya dokumen hanya punya satu status klasifikasi utama
        options: ["Sangat Rahasia", "Rahasia", "Terbatas", "Biasa", "Publik"]
        default: "Biasa"
        
      - {label: "Foto Dokumentasi", name: "image", widget: "image", required: false}
      
      # Ringkasan Eksekutif (Meta Description untuk SEO)
      - {label: "Ringkasan Eksekutif", name: "description", widget: "text", required: true, hint: "Wajib diisi untuk tampilan cuplikan di halaman depan."}
      
      # Isi Laporan
      - {label: "Isi Laporan Lengkap", name: "body", widget: "markdown"}

      # Draft: Kita tetap pertahankan sebagai parameter Hugo
      - {label: "Publikasikan Langsung?", name: "draft", widget: "boolean", default: false, hint: "Jika 'True', halaman tidak akan muncul di website meski sudah di-publish di CMS."}